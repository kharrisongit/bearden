services:
  - type: web
    name: bearden
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: bearden-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: DATA_KEY
        sync: false
      - key: ALLOWED_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_REDIRECT_URI
        sync: false
