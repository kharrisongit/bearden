name: Verify color themes
on:
  push:
    paths: ['public/**', 'test/color-picker.test.mjs', 'test-ui/color-picker.spec.mjs', 'test-ui/theme.spec.mjs', '.github/workflows/color-picker.yml']
  pull_request:
    paths: ['public/**', 'test/color-picker.test.mjs', 'test-ui/color-picker.spec.mjs', 'test-ui/theme.spec.mjs', '.github/workflows/color-picker.yml']
permissions:
  contents: read
jobs:
  color-themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test test/color-picker.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test test-ui/color-picker.spec.mjs test-ui/theme.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: color-theme-screenshots
          path: test-results/
